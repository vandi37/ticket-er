services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OWNERS: ${OWNERS}
      DB_CONN_STRING: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-12345}@db:5432/tracker?sslmode=disable
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-redis://:${REDIS_PASSWORD:-12345}@redis:6379/0}
      CHANNEL_ID: ${CHANNEL_ID}
    volumes:
      - ${LOG_PATH:-./logs}:/logs

  migrations:
    build:
      context: ./migrations
      dockerfile: Dockerfile
    command: goose -dir /migrations postgres "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-12345}@db:5432/tracker?sslmode=disable" up
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'goose -dir /migrations postgres "$$CONN_STRING" status | grep -q ''Pending'' && exit 1 || exit 0',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}

  db:
    image: postgres:18.6-alpine
    restart: always
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d tracker"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: tracker
    volumes:
      - ${DB_DATA_PATH:-./data/postgres}:/var/lib/postgresql/

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-12345}
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-12345}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ${REDIS_DATA_PATH:-./data/redis}:/data
